[project]
name = "grocery-meta-search"
version = "0.1.0"
description = "Flipp-style grocery meta search engine for Montreal: flyer discovery, item scraping, and store product search."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    "PyYAML>=6.0",
    "rapidocr-onnxruntime>=1.4",
    "pillow>=10.0",
    "pymupdf>=1.24",
    "numpy>=1.26",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "types-PyYAML>=6.0",
    "types-requests>=2.32",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
show_error_codes = true
warn_unused_ignores = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]
