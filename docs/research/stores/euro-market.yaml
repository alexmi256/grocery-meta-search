product_search:
  has_search: true
  url_pattern: "https://euro-market.ca/search?q={query}&type=product"
  location_scoped: false
  guest_ok: true
  kind: html                      # Shopify server-rendered search results
  api_notes: >-
    VERIFIED LIVE 2026-10-12: /search?q=confiture&type=product returned
    41 results with CAD prices + live stock ("Seulement, 9, restants!") +
    best-before dates. Predictive-search JSON API also verified:
    /search/suggest.json?q={query}&resources[type]=product returns structured
    JSON (price, available, tags, type, vendor, image). Site also has a
    /pages/rapid-search-results instant-search app page.
  bot_protection: none
  languages: [fr, en]

ecommerce:
  online_ordering: true
  click_and_collect: true
  notes: >-
    Shopify checkout; "Ramassage en magasin ou livraison partout au Canada"
    (in-store pickup or Canada-wide delivery) per directory profile;
    coparking.ch also lists in-store pickup for online orders. Product
    subscription program page (/pages/programme-dabonnement).

locations:
  count_estimate: 1
  locator_url: ""
  locator_api: ""
  notes: >-
    CONFIRMED single storefront: 4992 Chemin Queen Mary, Montréal QC H3W 1X2
    (514-344-3260) — Google 4.8★ (273 reviews), YellowPages, ProfileCanada,
    immigrer.com all agree; Category: Specialty/Gourmet Grocery Store.
    NOTE: Uber Eats lists "EURO MARKET (EPICERIE FRANÇAISE)" at 9500 Rue
    Meilleur #603 (Ahuntsic) — likely a separate dark-kitchen/delivery entry,
    NOT counted as a second storefront. Official contact page gives only
    "Montréal, Québec" without street address.

loyalty_program:
