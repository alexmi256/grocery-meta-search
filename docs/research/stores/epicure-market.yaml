product_search:
  has_search: true
  url_pattern: "https://shopepicure.ca/search?q={query}&type=product"
  location_scoped: false
  guest_ok: true
  kind: html                      # Shopify server-rendered search results
  api_notes: >-
    VERIFIED LIVE 2026-10-12 (user-reported search bar): /search?q=caviar&type=product
    returned 33 results with CAD prices (LUXE sturgeon caviar $45–$165,
    S&F lumpfish $6.99–$10.99, Krinos tarama $10.49, ECO CATCH ikura $89).
    Predictive-search JSON API also verified live:
    /search/suggest.json?q={query}&resources[type]=product returns structured
    JSON (id, title, price, available, image, vendor, type, url) — prime Phase 5
    source.
  bot_protection: none
  languages: [en, fr]

ecommerce:
  online_ordering: true
  click_and_collect: false
  notes: >-
    Shopify store with cart/checkout ("shop now"). Third-party directory
    profiles mention delivery + in-store pickup; NOT verified on
    shopepicure.ca checkout 2026-10-12.

locations:
  count_estimate: 3
  locator_url: https://shopepicure.ca/pages/our-locations
  locator_api: ""
  notes: >-
    CONFIRMED 3 (official locations page + site footer): 5252 Paré St,
    Montréal QC H4P 1P5 (514-904-0595); 5555 Westminster Ave N, Côte Saint-Luc
    QC H4W 2J2 (514-368-1741); 323 Chemin du Bord-du-Lac (Lakeshore),
    Pointe-Claire QC H9S 4L6 (514-505-9977). Legacy domain epicuremarket.ca
    (HTTP 500 on 2026-10-12) appears retired in favour of shopepicure.ca.

loyalty_program:
  name: "Club Épicurien"
  card_gated_prices: false
  notes: >-
    Legacy site (2017 snapshot) advertised a "Club Épicurien" membership card
