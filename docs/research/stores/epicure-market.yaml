notes: >-
  European (Eastern-European) specialty grocery — self-described "largest
  European food chain in Quebec": hot buffet, bakery, salad bar, Eastern
  European meats/cheeses, ready-to-eat, plus Epicure Signature catering
  platters. Directory categories: Specialty/Gourmet Grocery Store (4.7★,
  113 reviews, Montréal location). WHY MISSED: no presence on RFD's
  55-merchant flyers directory, Flipp, circulaires.club, or supermarches.ca;
  FR/EN query tracks never surfaced "Epicure"; ethnic-search track covered
  Polish (Batory) and French (Vieille Europe) but not this European chain.
  See parent report for full source-by-source analysis.
