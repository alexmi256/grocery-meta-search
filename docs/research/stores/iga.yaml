slug: iga
name: IGA
name_variants: ["IGA"]
store_type: traditional
footprint: qc-confirmed
tier: 1

website:
  url: https://www.iga.net
  languages: [fr, en]              # FR: iga.net/circulaire ; EN: iga.net/en/flyer (both fetched 2026-10-12)
  language_switch: path
  render_tech: ssr                 # flyer page returns full text on plain fetch; product/browse pages Google-indexed
  bot_protection: none             # flyer pages fetched HTTP 200 on 2026-10-12; one homepage probe returned HTTP 403 (possibly transient WAF)
# iga.ca is an alias domain serving the same content (observed iga.ca/fr/produits/... product URLs).

parent_company: Sobeys Inc. (Empire Company Limited)
affiliation: corporate             # franchised independent retailers under the Sobeys banner
banner_family: [IGA Extra, IGA Express]
# IGA = Independent Grocers Alliance; Quebec banner operated by Sobeys since 1998. ~194 IGA + ~133 IGA Extra stores in QC (2025).

flyers:
  has_flyers: true
  types:
    - type: weekly
      sources:
        - name: official:custom
          url: https://www.iga.net/circulaire
          kind: official
          format: html
          parse_friendliness: high    # SSR; store selection + regional eFlyer links server-rendered
          fetchability: http
          notes: official:custom (Sobeys/IGA platform (iga.net/circulaire); no finer platform id.)
        - name: flipp
          url: https://flipp.com/en-ca/verdun-qc/flyer/7725575-iga-quebec-weekly-eflyer
          kind: aggregator
          format: images
          parse_friendliness: medium   # page images + item-level JSON
          fetchability: browser-needed
        - name: circulaires.club
          url: https://circulaires.club/circulaire/circulaire-iga-du-8-au-14-octobre-2026/
          kind: aggregator
          format: images
          parse_friendliness: medium
          fetchability: http
        - name: rfd-flyers
          url: https://www.redflagdeals.com/in/montreal/flyers/
          kind: aggregator
          format: html
          parse_friendliness: medium
          fetchability: http
        - name: flyerbox.ca
          url: https://www.flyerbox.ca/fr/iga/
          kind: aggregator
          format: images
          parse_friendliness: medium
          fetchability: http
          languages: [fr, en]
        - name: circulairecanada.com
          url: https://www.circulairecanada.com/p/circulaire-iga-semaine-prochaine/
          kind: aggregator
          format: html
          parse_friendliness: low
          fetchability: http
          languages: [fr]
          notes: 'AI-written prose summaries of items; no stable brand hub.'
        - name: flyerseek.com
          url: http://flyerseek.com/iga-weekly-flyer/
          kind: aggregator
          format: html
          parse_friendliness: medium
          fetchability: http
          languages: [en]
        - name: supermarches.ca
          url: https://www.supermarches.ca/
          kind: aggregator
          format: html
          parse_friendliness: high
          fetchability: http
          languages: [fr]
          notes: 'Portal URL; per-store structured item listings under the "Centre des aubaines" section (see flyer-aggregators.md).'

      duration_days: 7
      flip_weekday: Thursday
      flip_timezone: America/Toronto
      validity_example: "2026-10-08 to 2026-10-14"
      per_store_variant: true     # "Please choose your store to access the promotions in your area"; regional eFlyers (Québec, New Brunswick, Iles-de-la-Madeleine) + per-store personalized flyer option
      languages: [fr, en]
      archive_available: false    # official site shows current publications only; aggregators keep expired editions
      structured_data: false      # not verified
      notes: "Official page offers 'Digital flyer' vs 'Personalized flyer' display modes. Regional editions: Québec, New Brunswick, Iles-de-la-Madeleine weekly eFlyers."
    - type: seasonal
      sources:
        - name: official:custom
          url: https://www.iga.net/circulaire
          kind: official
          format: html
          parse_friendliness: high
          fetchability: http
          notes: official:custom (Sobeys/IGA platform (iga.net/circulaire); no finer platform id.)
      duration_days: 90
      flip_weekday: Thursday
      flip_timezone: America/Toronto
      validity_example: ""
      per_store_variant: true
      languages: [fr, en]
      archive_available: false
      structured_data: false
      notes: "Seasonal booklets listed on flyer page (observed 'Autumn - QC' and 'Autumn - NB'); ~quarterly cadence, duration estimated."
    - type: catering
      sources:
        - name: official:custom
          url: https://www.iga.net/circulaire
          kind: official
          format: html
          parse_friendliness: high
          fetchability: http
          notes: official:custom (Sobeys/IGA platform (iga.net/circulaire); no finer platform id.)
      duration_days: 90
      flip_weekday: Thursday
      flip_timezone: America/Toronto
      validity_example: ""
      per_store_variant: true
      languages: [fr, en]
      archive_available: false
      structured_data: false
      notes: "'Catering QC' / 'Catering NB' booklets listed on flyer page (traiteur.iga.net PDF editions observed for prior seasons)."
    - type: coupon
      sources:
        - name: official:custom
          url: https://www.iga.net/circulaire
          kind: official
          format: html
          parse_friendliness: high
          fetchability: http
          notes: official:custom (Sobeys/IGA platform (iga.net/circulaire); no finer platform id.)
      duration_days: 7
      flip_weekday: Thursday
      flip_timezone: America/Toronto
      validity_example: ""
      per_store_variant: true
      languages: [fr, en]
      archive_available: false
      structured_data: false
      notes: "'Coupon' publication listed on flyer page; details not verified."

product_search:
  has_search: true
  url_pattern: "https://www.iga.net/fr/epicerie_en_ligne/parcourir/{category-path}?pageSize=24"
  location_scoped: true           # must choose a store; prices/promotions shown for the selected store
  guest_ok: true                 # browse/search pages are Google-indexed and render without login; ordering requires a registered account
  kind: html                     # server-rendered, indexed pages
  api_notes: "Browse URL pattern observed via indexed pages (iga.net/fr/epicerie_en_ligne/parcourir/...). Site has a search box ('search using multiple or single search words' per trade press). 30,000+ products per Sobeys. JSON API endpoints not directly observed."
  bot_protection: none
  languages: [fr, en]

ecommerce:
  online_ordering: true
  click_and_collect: true
  notes: "Online grocery for registered users (free account); in-store personal shoppers assemble orders; pickup and home delivery offered (fee structure historically $4 assembly under 65 / $4.50 delivery — older trade-press figure, verify before use). 247+ QC stores connected."

locations:
  count_estimate: 194
  locator_url: https://www.iga.net/en/stores
  locator_api: ""
  # 194 IGA stores in QC (2025). Locator: 'Find a store' link on iga.net; exact path not directly verified.

loyalty_program:
  name: "Scène+"
  card_gated_prices: true         # "Prix membre Scène+" vs "Sans carte Scène+" pricing in flyers
  # Sobeys/Empire program (sceneplus.ca). IGA historically offered AIR MILES; Scène+ is current.

notes: "Sobeys shared platform: IGA and IGA Extra use iga.net/iga.ca (same flyer page, same online-grocery platform). See iga-extra.yaml."
sources_checked: [official-site, flipp, rfd-flyers, circulaires.club, fr-search, en-search]
researched_at: "2026-10-12"
research_status: complete
