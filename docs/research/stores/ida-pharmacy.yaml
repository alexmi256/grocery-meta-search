notes: "RECOMMENDED-EXCLUDED: VERIFIED Flipp national-footer artifact. I.D.A. is a McKesson Canada banner for independent pharmacists active in ON/BC/SK (independent stores: Embrun ON, Sturgeon Falls ON, Callander ON, Mattawa ON, Kamloops BC, Langley BC, etc.), but NO Quebec (let alone Montreal) pharmacy operates under the Guardian/I.D.A./Remedy'sRx banner. McKesson's own contest terms for this banner network state contests are open 'to all residents of Canada, except Quebec residents', and its pharmacy locator has no Quebec listings. McKesson serves Quebec pharmacies under different banners (Uniprix, Proxim). Out of Quebec scope."
