notes: "URL CORRECTION (carried): given domain marcheandes.com resolves to www.marcheandes.com — canonical URL recorded with www. Latin-American grocer founded by the Aguilar family (Héctor Aguilar); épicerie + boulangerie + boucherie + restaurant comptoir. RE-INVESTIGATION 2026-10-12 (corrective pass): homepage bot check defeated by reading sitemap.xml — site is WordPress + WooCommerce with 7 product sitemaps, a /promotions/ page (FR/EN/ES, ongoing specials) and a fully open public Store API (searchable product catalog). flyer AND search flipped False→True. Failure modes hit: (a) dismissing site as 'bot-blocked' without enumerating sitemap/API — the original 'official-site-bot-blocked' note masked a fully inspectable backend; (b) no aggregator listing exists for this store, so aggregators alone could never have found it."
